name: CI

on:
  pull_request:
  push:
    branches: [dev]
  # deploy.yml runs it first on pushes to main.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `build` type-checks (tsc -b) before bundling.
      - run: npm run build
      - run: npm test
